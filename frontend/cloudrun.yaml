apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: inclusive-citizen-frontend
  annotations:
    # Allow unauthenticated access — this is the public-facing UI.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
    spec:
      serviceAccountName: inclusive-citizen-sa@PROJECT_ID.iam.gserviceaccount.com

      timeoutSeconds: 60
      containerConcurrency: 80

      containers:
        - image: gcr.io/PROJECT_ID/inclusive-citizen-frontend:COMMIT_SHA
          ports:
            - containerPort: 8080

          resources:
            limits:
              # 512 MiB is sufficient — Next.js standalone server has no ML models.
              memory: 512Mi
              cpu: '1'

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '8080'

          # ── Note: no NEXT_PUBLIC_ env vars here ──────────────────────────────
          # NEXT_PUBLIC_ variables are compiled into the JavaScript bundle at
          # `next build` time (Stage 1 of the Dockerfile) and cannot be changed
          # at runtime.  Injecting them as Cloud Run env vars has NO effect.
          # To change a NEXT_PUBLIC_ value you must rebuild the Docker image with
          # the new --build-arg values and redeploy.
          # ─────────────────────────────────────────────────────────────────────

  traffic:
    # Send 100 % of traffic to the latest revision.
    - latestRevision: true
      percent: 100
