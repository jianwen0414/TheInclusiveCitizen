steps:
  # Builds the Next.js image with NEXT_PUBLIC_ vars baked in, then pushes to
  # Artifact Registry.  Used for manual deployments — run this via:
  #
  #   gcloud builds submit . --config=frontend/cloudbuild-push.yaml \
  #     --substitutions=\
  #       _NEXT_PUBLIC_GENKIT_URL=https://...,\
  #       _NEXT_PUBLIC_API_BASE_URL=https://...,\
  #       _NEXT_PUBLIC_SUPABASE_URL=https://...,\
  #       _NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJ...
  #
  # After this finishes, run `gcloud run deploy` separately (see README).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--file=frontend/Dockerfile'
      - '--build-arg=NEXT_PUBLIC_GENKIT_URL=$_NEXT_PUBLIC_GENKIT_URL'
      - '--build-arg=NEXT_PUBLIC_API_BASE_URL=$_NEXT_PUBLIC_API_BASE_URL'
      - '--build-arg=NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '--tag=us-central1-docker.pkg.dev/$PROJECT_ID/inclusive-citizen/inclusive-citizen-frontend:latest'
      - '--cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/inclusive-citizen/inclusive-citizen-frontend:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/inclusive-citizen/inclusive-citizen-frontend:latest'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/inclusive-citizen/inclusive-citizen-frontend:latest'

substitutions:
  _NEXT_PUBLIC_GENKIT_URL: ''
  _NEXT_PUBLIC_API_BASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
