steps:
  # Step 1: Build the frontend Docker image.
  #
  # The Next.js app lives at the repository root, so the build context is '.'
  # (the repo root) and the Dockerfile is specified with -f.
  #
  # All NEXT_PUBLIC_ variables are baked into the Next.js bundle at build time
  # and cannot be changed without rebuilding the image.  They are passed here
  # as Docker build arguments sourced from Cloud Build substitution variables.
  #
  # Substitution variables must be supplied when triggering a build:
  #   gcloud builds submit . --config=frontend/cloudbuild.yaml \
  #     --substitutions=\
  #       _NEXT_PUBLIC_GENKIT_URL=https://genkit-xxxx.run.app,\
  #       _NEXT_PUBLIC_API_BASE_URL=https://backend-xxxx.run.app,\
  #       _NEXT_PUBLIC_SUPABASE_URL=https://xxx.supabase.co,\
  #       _NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJ...
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--file=frontend/Dockerfile'
      - '--tag=gcr.io/$PROJECT_ID/inclusive-citizen-frontend:$COMMIT_SHA'
      - '--tag=gcr.io/$PROJECT_ID/inclusive-citizen-frontend:latest'
      - '--cache-from=gcr.io/$PROJECT_ID/inclusive-citizen-frontend:latest'
      - '--build-arg=NEXT_PUBLIC_GENKIT_URL=$_NEXT_PUBLIC_GENKIT_URL'
      - '--build-arg=NEXT_PUBLIC_API_BASE_URL=$_NEXT_PUBLIC_API_BASE_URL'
      - '--build-arg=NEXT_PUBLIC_SUPABASE_URL=$_NEXT_PUBLIC_SUPABASE_URL'
      - '--build-arg=NEXT_PUBLIC_SUPABASE_ANON_KEY=$_NEXT_PUBLIC_SUPABASE_ANON_KEY'
      - '.'

  # Step 2: Push both tags to Google Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/inclusive-citizen-frontend'

  # Step 3: Deploy to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - replace
      - frontend/cloudrun.yaml
      - '--region=us-central1'
    env:
      - 'COMMIT_SHA=$COMMIT_SHA'

images:
  - 'gcr.io/$PROJECT_ID/inclusive-citizen-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/inclusive-citizen-frontend:latest'

substitutions:
  # Default values — override at build trigger time or via --substitutions flag.
  _NEXT_PUBLIC_GENKIT_URL: ''
  _NEXT_PUBLIC_API_BASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_URL: ''
  _NEXT_PUBLIC_SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY
